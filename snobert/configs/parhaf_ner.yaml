OUTPUTS: 'output_parhaf_ner'

data:
  label_source: parhaf
  use_provided_split: true
  entity_types: [Infection, Site, Bacterie, Bacteriemie]
  note_path: data/parhaf_infectiology/notes.csv
  annotations_path: data/parhaf_infectiology/annotations.csv
  sctid_syn_path: data/preprocess_data
  test_fold: 2

# Official PARHAF labels kept; local folds: 0=train(100), 1=val(20), 2=test(14).
# Test is never used for checkpoint save (see data.test_fold).
n_fold: 3
split: 1
chunked_repeat: 2

IS_MASTER: False
competition: 'parhaf_ner'
val: False
apex: True
print_freq: 100
num_workers: 4

# French biomedical (continual pretrain of camembert-base). Not BiomedBERT.
model: "almanach/camembert-bio-base"

scheduler: 'linear'
batch_scheduler: True
num_cycles: 0.5
num_warmup_steps: 50
epochs: 50
model_EMA: .997
encoder_lr: 0.00005
decoder_lr: 0.00005
min_lr: 0.00002
eps: 0.000001
betas: [0.9, 0.999]
batch_size: 4
fc_dropout: 0.05
max_len: 512
weight_decay: 0.01
gradient_accumulation_steps: 4
max_grad_norm: 1000
seed: 42

# O, then B/I for Infection, Site, Bacterie, Bacteriemie
class_weights: [0.15, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]

mixup: false
mixup_alpha: 0.7
mixup_tau: 1.0
mixup_radius: null

PARALLEL:
  DDP: false
  GPUS: [0]
  LOCAL_RANK: ${oc.decode:${oc.env:LOCAL_RANK, 0}}
  WORLD_SIZE: ${oc.decode:${oc.env:WORLD_SIZE, 0}}

torch:
  benchmark: True
  deterministic: False
  detect_anomaly: False
  channels_last: False
  cuda_allow_tf32: True
  cudnn_allow_tf32: True
  sync_bn: False
  find_unused_parameters: True
  broadcast_buffers: True

hydra:
  output_subdir: null
  run:
    dir: ./output_parhaf_ner/.hydra_out/${now:%m-%d}/${now:%H-%M-%S}
  sweep:
    dir : ./output_parhaf_ner/.hydra_out/${now:%m-%d}/${now:%H-%M-%S}_SWEEP
    subdir: J${hydra.job.num}
